<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>SitIsa — Praia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">

    <!-- ===================== CÉU ===================== -->
    <div class="sky band"></div>

    <!-- contador regressivo para o verão -->
    <p class="spring-count" aria-live="polite">Contando os dias para o Verão da Isa…</p>

    <!-- ===================== MAR ===================== -->
    <div class="sea band"></div>

    <!-- ===================== AREIA ===================== -->
    <div class="sand band"></div>

    <!-- espuma / arrebentação na divisa mar-areia -->
    <svg class="shore" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 40 C 240 8 480 64 720 40 C 960 16 1200 66 1440 40 L1440 80 L0 80 Z" fill="rgba(255,255,255,.55)"/>
    </svg>

    <!-- faixa de água que passa na frente dos barcos (esconde o casco abaixo da linha d'água) -->
    <div class="sea-front" aria-hidden="true"></div>

    <!-- coqueiral decorativo (gerado por script, atrás dos elementos interativos) -->
    <div class="grove" aria-hidden="true"></div>

    <!-- ===================== ELEMENTOS INTERATIVOS ===================== -->

    <!-- Sol -->
    <button class="el sun" style="top:6%; right:9%" aria-label="Sol">
      <span class="art">
        <svg viewBox="0 0 140 140" aria-hidden="true">
          <g class="rays-wrap">
            <g class="rays" stroke="#ffcf3f" stroke-width="9" stroke-linecap="round">
              <line x1="70" y1="4" x2="70" y2="30"/>
              <line x1="70" y1="4" x2="70" y2="30" transform="rotate(45 70 70)"/>
              <line x1="70" y1="4" x2="70" y2="30" transform="rotate(90 70 70)"/>
              <line x1="70" y1="4" x2="70" y2="30" transform="rotate(135 70 70)"/>
              <line x1="70" y1="4" x2="70" y2="30" transform="rotate(180 70 70)"/>
              <line x1="70" y1="4" x2="70" y2="30" transform="rotate(225 70 70)"/>
              <line x1="70" y1="4" x2="70" y2="30" transform="rotate(270 70 70)"/>
              <line x1="70" y1="4" x2="70" y2="30" transform="rotate(315 70 70)"/>
            </g>
          </g>
          <circle cx="70" cy="70" r="30" fill="#ffd23f"/>
        </svg>
      </span>
    </button>

    <!-- Nuvens -->
    <button class="el cloud" style="top:9%; left:6%; --t:26s" aria-label="Nuvem">
      <span class="art">
        <svg viewBox="0 0 180 100" aria-hidden="true">
          <g fill="#ffffff">
            <ellipse cx="55" cy="62" rx="38" ry="26"/>
            <ellipse cx="95" cy="48" rx="44" ry="32"/>
            <ellipse cx="130" cy="64" rx="34" ry="24"/>
            <rect x="45" y="64" width="95" height="28" rx="14"/>
          </g>
        </svg>
      </span>
    </button>

          </g>
        </svg>
      </span>
    </button>

            <path class="sg-tail" d="M50 94 C 46 106 55 116 49 128 C 45 136 43 132 46 126" fill="none"/>
