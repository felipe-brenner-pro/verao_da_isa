<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>SitIsa — Praia</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">

    <!-- ===================== CÉU ===================== -->
    <div class="sky band"></div>

    <!-- contador regressivo para o verão -->
    <p class="spring-count" aria-live="polite">Contando os dias para o Verão da Isa…</p>

    <!-- ===================== MAR ===================== -->
    <div class="sea band"></div>

    <!-- ===================== AREIA ===================== -->
    <div class="sand band"></div>

    <!-- espuma / arrebentação na divisa mar-areia -->
    <svg class="shore" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 40 C 240 8 480 64 720 40 C 960 16 1200 66 1440 40 L1440 80 L0 80 Z" fill="rgba(255,255,255,.55)"/>
    </svg>

    <!-- faixa de água que passa na frente dos barcos (esconde o casco abaixo da linha d'água) -->
    <div class="sea-front" aria-hidden="true"></div>

    <!-- ===================== ELEMENTOS INTERATIVOS ===================== -->

    <!-- Menina de biquíni na cadeira de praia -->
    <button class="el sunbather" style="bottom:7%; left:47%" aria-label="Menina tomando sol na cadeira de praia">
      <span class="art">
        <svg viewBox="0 0 140 150" aria-hidden="true">
          <defs>
            <clipPath id="chairClip"><path d="M53 32 L87 32 L108 135 L32 135 Z"/></clipPath>
          </defs>

          <ellipse cx="70" cy="140" rx="50" ry="7" fill="rgba(0,0,0,.12)"/>

          <!-- pés da cadeira -->
          <g stroke="#a9723c" stroke-width="4.5" stroke-linecap="round" fill="none">
            <path d="M36 122 L30 140"/>
            <path d="M104 122 L110 140"/>
            <path d="M55 34 L51 50"/>
            <path d="M85 34 L89 50"/>
          </g>

          <!-- encosto -->
          <path d="M54 6 L86 6 L88 32 L52 32 Z" fill="#fdfdfd"/>
          <path d="M54 6 L86 6 L87 18 L53 18 Z" fill="#ff9d9d"/>
          <path d="M54 6 L86 6 L88 32 L52 32 Z" fill="none" stroke="#a9723c" stroke-width="3"/>
          <ellipse cx="70" cy="12" rx="14" ry="5" fill="#ffe4bd"/>
          <ellipse cx="70" cy="11" rx="11" ry="3.4" fill="#fff1dd"/>

          <!-- superfície reclinada -->
          <path d="M53 32 L87 32 L108 135 L32 135 Z" fill="#fdfdfd"/>
          <g clip-path="url(#chairClip)">
            <rect x="26" y="46" width="88" height="11" fill="#ff9d9d"/>
            <rect x="26" y="74" width="88" height="13" fill="#ff9d9d"/>
            <rect x="26" y="104" width="88" height="14" fill="#ff9d9d"/>
          </g>
          <path d="M53 32 L87 32 L108 135 L32 135 Z" fill="none" stroke="#a9723c" stroke-width="3"/>
          <path d="M53 32 L87 32" stroke="#a9723c" stroke-width="2" opacity=".4"/>
          <path d="M35 74 L53 64" stroke="#a9723c" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M105 74 L87 64" stroke="#a9723c" stroke-width="3.2" stroke-linecap="round"/>

          <!-- ===== menina (proporções normais, reclinada) ===== -->
          <g class="girl">
            <!-- cabelo ondulado no encosto + laterais longas -->
            <path d="M53 30 Q 47 4 70 1 Q 93 4 87 30 Q 85 22 83 26 Q 84 16 78 17 Q 80 10 72 12 Q 70 6 68 12 Q 60 10 62 17 Q 56 16 57 26 Q 55 22 53 30 Z" fill="#6b4429"/>
            <path d="M55 20 Q 49 34 53 48 Q 50 42 51 36 Q 48 44 50 52 Q 46 44 48 34 Q 50 26 55 20 Z" fill="#6b4429"/>
            <path d="M85 20 Q 91 34 87 48 Q 90 42 89 36 Q 92 44 90 52 Q 94 44 92 34 Q 90 26 85 20 Z" fill="#6b4429"/>

            <!-- braço esquerdo descansando ao lado -->
            <path d="M60 40 Q 53 54 56 68" stroke="#f2c9a0" stroke-width="4.4" fill="none" stroke-linecap="round"/>
            <ellipse cx="56" cy="69" rx="2.8" ry="2.4" fill="#f2c9a0"/>

            <!-- pernas normais: coxa afina até o joelho -->
            <path d="M60 60 C 57 74 58 88 61 100 L 69 100 C 70 88 70 74 70 60 Z" fill="#f4cba1"/>
            <path d="M70 60 C 70 74 70 88 72 100 L 80 100 C 83 88 83 74 80 60 Z" fill="#f4cba1"/>
            <ellipse cx="65" cy="100" rx="5" ry="5.6" fill="#f4cba1"/>
            <ellipse cx="76" cy="100" rx="5" ry="5.6" fill="#f4cba1"/>
            <path d="M63 103 Q 60 116 59 129" stroke="#f6cda3" stroke-width="6.4" fill="none" stroke-linecap="round"/>
            <path d="M78 103 Q 81 116 82 129" stroke="#f6cda3" stroke-width="6.4" fill="none" stroke-linecap="round"/>
            <path d="M55 125 Q 51 138 60 139 Q 65 139 64 123 Q 60 119 55 125 Z" fill="#f6cda3"/>
            <path d="M86 125 Q 90 138 81 139 Q 76 139 77 123 Q 81 119 86 125 Z" fill="#f6cda3"/>
            <g stroke="#e6b78e" stroke-width=".8" opacity=".5" stroke-linecap="round">
              <path d="M56 130 l0 5"/><path d="M59 129 l0 6"/><path d="M62 130 l0 5"/>
              <path d="M85 130 l0 5"/><path d="M82 129 l0 6"/><path d="M79 130 l0 5"/>
            </g>

            <!-- quadril curvo -->
            <path d="M58 51 Q 70 59 82 51 Q 84 61 80 71 Q 70 76 60 71 Q 56 61 58 51 Z" fill="#f4cba1"/>

            <!-- biquíni: calcinha -->
            <path d="M58 50 Q 70 55 82 50 L 79 61 Q 70 65 61 61 Z" fill="#ffd21f"/>
            <circle cx="59" cy="50" r="1.8" fill="#f5b800"/>
            <circle cx="81" cy="50" r="1.8" fill="#f5b800"/>

            <!-- colo / decote preenchido (tom de pele) -->
            <path d="M54 44 Q 58 30 66 24 L 74 24 Q 82 30 86 44 Z" fill="#f4cba1"/>

            <!-- torso: cintura marcada -->
            <path d="M59 34 Q 63 42 64 47 Q 59 51 62 58 L 78 58 Q 81 51 76 47 Q 77 42 81 34 Q 74 39 70 39 Q 66 39 59 34 Z" fill="#f4cba1"/>
            <circle cx="70" cy="50" r="1" fill="#dcab80"/>

            <!-- busto + biquíni top triângulos -->
            <path d="M58 35 Q 63 47 70 47 Q 63 40 61 33 Z" fill="#f0c39c"/>
            <path d="M82 35 Q 77 47 70 47 Q 77 40 79 33 Z" fill="#f0c39c"/>
            <path d="M59 35 Q 64 46 70 46 Q 64 39 62 33 Z" fill="#ffd21f"/>
            <path d="M81 35 Q 76 46 70 46 Q 76 39 78 33 Z" fill="#ffd21f"/>
            <path d="M57 33 Q 70 28 83 33" stroke="#ffd21f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            <path d="M62 33 Q 70 26 78 33" stroke="#ffd21f" stroke-width="1.7" fill="none" stroke-linecap="round"/>

            <!-- braço direito LEVANTADO até os óculos -->
            <g class="lift-hand">
              <path d="M80 40 Q 91 33 89 22 Q 88 17 82 17" stroke="#f2c9a0" stroke-width="4.6" fill="none" stroke-linecap="round"/>
              <ellipse cx="80" cy="17" rx="3.1" ry="2.7" fill="#f2c9a0"/>
            </g>

            <!-- pescoço -->
            <path d="M65.5 23 L65.5 29 Q 70 33 74.5 29 L74.5 23 Z" fill="#f2c9a0"/>

            <!-- cabeça -->
            <circle cx="70" cy="20" r="9" fill="#f6cda3"/>
            <path d="M60 18 Q 65 9 70 10 Q 75 9 80 18 Q 74 14 70 14 Q 66 14 60 18 Z" fill="#6b4429"/>
            <path d="M60 19 Q 57 27 60 34 Q 62 28 61 20 Z" fill="#6b4429"/>
            <path d="M80 19 Q 83 27 80 34 Q 78 28 79 20 Z" fill="#6b4429"/>

            <g class="eyes">
              <ellipse class="eye-l" cx="66.4" cy="20" rx="1.3" ry="1.6" fill="#42301f"/>
              <ellipse class="wink-eye" cx="73.6" cy="20" rx="1.3" ry="1.6" fill="#42301f"/>
              <path class="wink-line" d="M71.8 19.6 Q 73.6 21.8 75.4 19.6" fill="none" stroke="#42301f" stroke-width="1.1" stroke-linecap="round" opacity="0"/>
              <g stroke="#42301f" stroke-linecap="round" fill="none" stroke-width=".62">
                <!-- pálpebra + leque de cílios: olho esquerdo -->
                <path d="M63.9 19.4 Q 66.4 18 68.9 19" stroke-width=".8"/>
                <path d="M68.5 18.9 Q 68.9 17.9 68.6 17.1"/>
                <path d="M67.6 18.7 Q 67.7 17.5 67 16.7"/>
                <path d="M66.7 18.6 Q 66.4 17.2 65.6 16.5"/>
                <path d="M65.8 18.7 Q 65.1 17.4 64 16.8"/>
                <path d="M64.9 19 Q 63.8 17.9 62.6 17.4"/>
                <path d="M64.2 19.4 Q 62.6 18.8 61.2 18.3"/>
                <!-- olho direito (espelhado) -->
                <path d="M76.1 19.4 Q 73.6 18 71.1 19" stroke-width=".8"/>
                <path d="M71.5 18.9 Q 71.1 17.9 71.4 17.1"/>
                <path d="M72.4 18.7 Q 72.3 17.5 73 16.7"/>
                <path d="M73.3 18.6 Q 73.6 17.2 74.4 16.5"/>
                <path d="M74.2 18.7 Q 74.9 17.4 76 16.8"/>
                <path d="M75.1 19 Q 76.2 17.9 77.4 17.4"/>
                <path d="M75.8 19.4 Q 77.4 18.8 78.8 18.3"/>
              </g>
            </g>
            <path d="M70 21.6 l 0 2" stroke="#d9a77b" stroke-width="1" stroke-linecap="round"/>
            <path class="mouth-rest" d="M67.8 25.4 Q 70 26.6 72.2 25.4" fill="none" stroke="#c8607a" stroke-width="1.2" stroke-linecap="round"/>
            <path class="mouth-smile" d="M66.4 24.2 Q 70 28 73.6 24.2" fill="none" stroke="#c8607a" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="63.6" cy="22.6" r="1.4" fill="#f4a9b8" opacity=".4"/>
            <circle cx="76.4" cy="22.6" r="1.4" fill="#f4a9b8" opacity=".4"/>

            <g class="shades">
              <rect x="62.4" y="17" width="6.4" height="5" rx="2.2" fill="#20202a"/>
              <rect x="71.2" y="17" width="6.4" height="5" rx="2.2" fill="#20202a"/>
              <line x1="68.8" y1="18.4" x2="71.2" y2="18.4" stroke="#20202a" stroke-width="1.5"/>
              <line x1="62.4" y1="18" x2="59.8" y2="17" stroke="#20202a" stroke-width="1.3"/>
              <line x1="77.6" y1="18" x2="80.2" y2="17" stroke="#20202a" stroke-width="1.3"/>
              <path d="M63.8 18 l 2 -.8" stroke="#70707f" stroke-width=".8" opacity=".7" stroke-linecap="round"/>
            </g>
          </g>
        </svg>
      </span>
    </button>

    <p class="hint" id="hint">toque nos elementos da praia&nbsp;✦</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
